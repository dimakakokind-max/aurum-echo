<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURUM | Анонимная Лента</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500;700&display=swap');
        :root { --bg: #030303; --text: #f0f0f0; --muted: #888; --accent: #d4af37; --glass: rgba(255,255,255,0.03); --border: rgba(255,255,255,0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* Курсор */
        .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s; }
        .cursor-outline { position: fixed; width: 40px; height: 40px; border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); }
        .cursor-hover .cursor-dot { width: 60px; height: 60px; background: rgba(212, 175, 55, 0.2); }

        /* Навигация */
        nav { position: fixed; top: 0; left: 0; width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background: rgba(3,3,3,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); z-index: 100; }
        .nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; letter-spacing: 5px; color: var(--accent); text-decoration: none; font-weight: 600; }
        
        /* Контейнер */
        .container { max-width: 800px; margin: 100px auto 50px; padding: 0 20px; }

        /* Форма поста */
        .post-form { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 30px; margin-bottom: 40px; position: relative; }
        .post-form textarea { width: 100%; background: transparent; border: none; color: #fff; font-size: 1.1rem; resize: none; outline: none; min-height: 100px; font-family: 'Inter', sans-serif; }
        .post-form .btn { margin-top: 15px; background: var(--accent); color: #000; padding: 10px 30px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; float: right; transition: 0.3s; }
        .post-form .btn:hover { transform: scale(1.05); }
        .clearfix::after { content: ""; clear: both; display: table; }

        /* Карточка поста */
        .post-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 20px; transition: 0.3s; animation: fadeIn 0.5s ease-out; }
        .post-card:hover { border-color: var(--accent); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .post-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #333; color: var(--accent); display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; border: 1px solid var(--accent); }
        .post-author { font-weight: bold; font-size: 1rem; color: var(--text); }
        .post-time { font-size: 0.8rem; color: var(--muted); margin-left: auto; }
        .post-content { font-size: 1.1rem; line-height: 1.6; color: #ddd; word-break: break-word; }

        .loading { text-align: center; color: var(--muted); padding: 20px; }

        @media (max-width: 768px) {
            nav { padding: 15px 20px; }
            .cursor-dot, .cursor-outline { display: none; }
            * { cursor: auto; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav>
        <a href="#" class="nav-logo">AURUM</a>
        <div id="status" style="font-size: 0.8rem; color: var(--muted);">Подключение...</div>
    </nav>

    <div class="container">
        <div class="post-form">
            <textarea id="post-content" placeholder="Поделитесь мыслью анонимно..."></textarea>
            <div class="clearfix">
                <button class="btn" onclick="createPost()">Опубликовать</button>
            </div>
        </div>

        <div id="feed">
            <div class="loading">Загрузка ленты...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Твои ключи (замени на свои, если нужно)
        const firebaseConfig = {
            apiKey: "AIzaSyB-n2wL94hvryB-56V9Mydna57qWJTaUDE",
            authDomain: "ssss-b2af1.firebaseapp.com",
            databaseURL: "https://ssss-b2af1-default-rtdb.firebaseio.com",
            projectId: "ssss-b2af1",
            storageBucket: "ssss-b2af1.firebasestorage.app",
            messagingSenderId: "992229397721",
            appId: "1:992229397721:web:7850439a92db4faa341ac8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const statusEl = document.getElementById('status');

        // Вход анонимно
        onAuthStateChanged(auth, (user) => {
            if (user) {
                statusEl.innerText = "Анонимный вход выполнен";
                statusEl.style.color = "var(--accent)";
                loadFeed();
            } else {
                signInAnonymously(auth).catch((error) => {
                    statusEl.innerText = "Ошибка входа";
                    statusEl.style.color = "red";
                    console.error(error);
                });
            }
        });

        // Публикация поста
        window.createPost = async () => {
            const content = document.getElementById('post-content').value.trim();
            if (!content) return alert("Напишите что-нибудь!");

            try {
                await addDoc(collection(db, "posts"), {
                    content: content,
                    authorId: auth.currentUser.uid,
                    authorName: "Аноним", // Все посты от анонима
                    timestamp: new Date()
                });

                document.getElementById('post-content').value = '';
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        };

        // Загрузка ленты
        function loadFeed() {
            const feedEl = document.getElementById('feed');
            const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));

            onSnapshot(q, (snapshot) => {
                feedEl.innerHTML = '';
                if (snapshot.empty) {
                    feedEl.innerHTML = '<div class="loading">Пока пусто. Будьте первым!</div>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const post = doc.data();
                    const date = post.timestamp ? post.timestamp.toDate().toLocaleString() : "Только что";
                    
                    const postEl = document.createElement('div');
                    postEl.className = 'post-card';
                    postEl.innerHTML = `
                        <div class="post-header">
                            <div class="avatar">?</div>
                            <div>
                                <div class="post-author">Аноним</div>
                            </div>
                            <div class="post-time">${date}</div>
                        </div>
                        <div class="post-content">${post.content}</div>
                    `;
                    feedEl.appendChild(postEl);
                });
            });
        }

        // Курсор
        const dot = document.querySelector('.cursor-dot');
        const outline = document.querySelector('.cursor-outline');
        document.addEventListener('mousemove', (e) => {
            const posX = e.clientX;
            const posY = e.clientY;
            dot.style.left = `${posX}px`;
            dot.style.top = `${posY}px`;
            outline.animate({ left: `${posX}px`, top: `${posY}px` }, { duration: 500, fill: "forwards" });
        });
        const hoverElements = document.querySelectorAll('button, textarea, a');
        hoverElements.forEach(el => {
            el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
            el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
        });
    </script>
</body>
</html>
